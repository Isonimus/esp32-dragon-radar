[platformio]
default_envs = custom

; ============================================================
;  Common settings shared by all hardware targets
; ============================================================
[common]
; Pinned: an unpinned "espressif32" resolves to whichever release is already in
; the global PlatformIO cache, so two machines can build different cores.
; pioarduino 55.03.37 ships Arduino core 3.3.7, the core every env was verified against.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; Exact versions, so a release is built against the code it was tested with (ADR-0008).
lib_deps =
    lovyan03/LovyanGFX @ 1.2.19
    mikalhart/TinyGPSPlus @ 1.1.0

; ============================================================
;  Custom Board — ESP32-C3 + GC9A01 Round Display
; ============================================================
[env:custom]
platform = ${common.platform}
board = esp32-c3-devkitm-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps =
    ${common.lib_deps}
    pololu/LSM303 @ 3.0.1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_CUSTOM
build_src_filter = +<*> -<hal/boards/*> +<hal/boards/custom/> -<audio/> -<imu/> +<compass/>

; ============================================================
;  M5Cardputer (M5StampS3)
; ============================================================
[env:cardputer]
platform = ${common.platform}
board = m5stack-stamps3
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps =
    ${common.lib_deps}
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_CARDPUTER
build_src_filter = +<*> -<hal/boards/*> +<hal/boards/cardputer/> -<imu/> -<compass/>

; ============================================================
;  M5StickC Plus 2
; ============================================================
[env:m5stickc-plus2]
platform = ${common.platform}
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_M5STICKC
build_src_filter = +<*> -<hal/boards/*> +<hal/boards/m5stickc/> -<compass/>

; ============================================================
;  Native (unit tests on host — no hardware)
; ============================================================
[env:native]
platform = native
test_framework = unity
lib_deps =
    mikalhart/TinyGPSPlus @ 1.1.0
lib_ldf_mode = deep+
lib_archive = no
build_flags =
    -std=c++11
    -D UNIT_TEST
    -D UNITY_INCLUDE_DOUBLE
    -I.pio/libdeps/native/TinyGPSPlus/src
    -Itest/mocks
build_src_filter = +<math/> +<game/> +<gps/>
