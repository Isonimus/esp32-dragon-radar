; Radar render probe (src/probes/radar_render_probe.cpp). Builds the probe in place of
; the game for one board, from the repo root:
;   pio run -c probes/radar-render.ini -e probe-cardputer -t upload
;   pio device monitor -b 115200     (the PROBE lines; then '1'-'4' and S to capture)
[platformio]
extra_configs = platformio.ini

[probe]
build_flags = -DRADAR_RENDER_PROBE

[env:probe-custom]
extends = env:custom
build_flags = ${env:custom.build_flags} ${probe.build_flags}
build_src_filter = ${env:custom.build_src_filter} -<main.cpp>

[env:probe-cardputer]
extends = env:cardputer
build_flags = ${env:cardputer.build_flags} ${probe.build_flags}
build_src_filter = ${env:cardputer.build_src_filter} -<main.cpp>

[env:probe-m5stickc-plus2]
extends = env:m5stickc-plus2
build_flags = ${env:m5stickc-plus2.build_flags} ${probe.build_flags}
build_src_filter = ${env:m5stickc-plus2.build_src_filter} -<main.cpp>
